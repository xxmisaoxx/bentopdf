name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://vietpdf.com
          VITE_BRAND_NAME: VietPDF
          VITE_BRAND_LOGO: images/favicon-no-bg.svg
          VITE_FOOTER_TEXT: © 2026 VietPDF. All rights reserved.
          VITE_DEFAULT_LANGUAGE: en
          VITE_CORS_PROXY_URL: https://vietpdf-cors-proxy.misao.workers.dev
          VITE_LIBREOFFICE_CDN_URL: https://vietpdf-r2-assets.misao.workers.dev/libreoffice-wasm/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: dc517368fcdd4d6206f916eac6045bc4
          command: pages deploy dist --project-name=vietpdf --branch=main --commit-dirty=true
