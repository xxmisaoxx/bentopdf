{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-white border-b border-gray-100 sticky top-0 z-30">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}VietPDF{{/if}} Logo"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-gray-900 font-bold text-xl ml-2">
          <a href="index.html"
            >{{#if brandName}}{{brandName}}{{else}}VietPDF{{/if}}</a
          >
        </span>
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-1">
        <!-- All PDF tools dropdown -->
        <div class="relative group">
          <button
            class="inline-flex items-center gap-1 px-4 py-2 text-gray-700 hover:text-gray-900 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors"
          >
            <span data-i18n="nav.allTools">All PDF tools</span>
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
          <div
            class="absolute left-0 mt-1 w-56 bg-white rounded-xl shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 py-2"
          >
            <a
              href="tools.html"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900"
              >All Tools</a
            >
            <a
              href="pdf-merge-split.html"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900"
              >Merge & Split</a
            >
            <a
              href="pdf-converter.html"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900"
              >Converter</a
            >
            <a
              href="pdf-editor.html"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900"
              >PDF Editor</a
            >
            <a
              href="pdf-security.html"
              class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-gray-900"
              >Security</a
            >
          </div>
        </div>

        <a
          href="about.html"
          class="px-4 py-2 text-gray-700 hover:text-gray-900 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors"
          data-i18n="nav.about"
          >About</a
        >
        <a
          href="contact.html"
          class="px-4 py-2 text-gray-700 hover:text-gray-900 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors"
          data-i18n="nav.contact"
          >Contact</a
        >
        <a
          href="faq.html"
          class="px-4 py-2 text-gray-700 hover:text-gray-900 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors"
          >FAQ</a
        >
      </div>

      <!-- Right side actions -->
      <div class="hidden md:flex items-center gap-3">
        <a
          href="https://github.com/alam00000/bentopdf/"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-gray-900 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors"
        >
          <svg
            class="w-4 h-4"
            fill="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
              clip-rule="evenodd"
            />
          </svg>
          <span id="github-stars-desktop">-</span>
        </a>
        <div class="h-4 w-px bg-gray-200"></div>
        <button
          id="language-toggle"
          class="inline-flex items-center gap-1.5 text-sm font-medium text-gray-600 hover:text-gray-900 px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors"
        >
          <i data-lucide="globe" class="w-4 h-4"></i>
          <span>EN</span>
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="md:hidden flex items-center gap-2">
        <button
          id="language-toggle-mobile"
          class="p-2 text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-50 transition-colors"
        >
          <i data-lucide="globe" class="w-5 h-5"></i>
        </button>
        <button
          id="mobile-menu-button"
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only" data-i18n="nav.openMainMenu"
            >Open main menu</span
          >
          <svg
            id="menu-icon"
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <svg
            id="close-icon"
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    id="mobile-menu"
    class="hidden md:hidden bg-white border-t border-gray-100 shadow-lg"
  >
    <div class="px-4 pt-2 pb-4 space-y-1">
      <a
        href="tools.html"
        class="block px-3 py-2.5 text-gray-700 hover:text-gray-900 hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors"
        >All PDF Tools</a
      >
      <a
        href="about.html"
        class="block px-3 py-2.5 text-gray-700 hover:text-gray-900 hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors"
        data-i18n="nav.about"
        >About</a
      >
      <a
        href="contact.html"
        class="block px-3 py-2.5 text-gray-700 hover:text-gray-900 hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors"
        data-i18n="nav.contact"
        >Contact</a
      >
      <a
        href="faq.html"
        class="block px-3 py-2.5 text-gray-700 hover:text-gray-900 hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors"
        >FAQ</a
      >
      <a
        href="licensing.html"
        class="block px-3 py-2.5 text-gray-700 hover:text-gray-900 hover:bg-gray-50 rounded-lg text-sm font-medium transition-colors"
        data-i18n="nav.licensing"
        >Licensing</a
      >
    </div>
  </div>
</nav>
{{/if}}
